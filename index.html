<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Portfolio Card</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <div class="avatar">
        <img
          src="https://api.dicebear.com/7.x/adventurer/svg?seed=YourName"
          alt="Avatar"
        />
      </div>

      <h1>Nour Ibrahim</h1>
      <h2>Frontend Engineer</h2>

      <p>
        Frontend Engineer متخصصة في بناء واجهات مستخدم سريعة ومتجاوبة. أحول
        الأفكار إلى كود نظيف وتجارب ممتعة.
      </p>

      <div class="skills">
        <span>React.js</span>
        <span>JavaScript</span>
        <span>TypeScript</span>
        <span>HTML/CSS</span>
        <span>Git</span>
      </div>

      <div class="buttons">
        <a href="#" class="btn primary">GitHub</a>
        <a href="#" class="btn secondary">LinkedIn</a>
      </div>

      <button class="theme-toggle" id="themeToggle">🌙 Dark Mode</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
